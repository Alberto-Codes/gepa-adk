name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'  # Full compatibility every Monday, UTC.
  workflow_dispatch:
    inputs:
      full:
        description: Run the full OS/Python/ADK cross-product
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      mode: ${{ steps.matrix.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select compatibility coverage
        id: matrix
        env:
          FORCE_FULL: ${{ inputs.full || false }}
        run: |
          python scripts/ci_matrix.py > plan.json
          cat plan.json
          echo "matrix=$(jq -c '.matrix' plan.json)" >> "$GITHUB_OUTPUT"
          echo "mode=$(jq -r '.mode' plan.json)" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Retry once on exit 3 only (runtime or configuration error, which
      # covers the advisory-fetch crash). Findings exit 1, 2, or 4 and
      # fail immediately.
      - name: uv-secure
        run: |
          code=0
          uv run uv-secure || code=$?
          if [ "$code" -eq 3 ]; then
            echo "uv-secure crashed (exit 3), retrying once"
            uv run uv-secure
          else
            exit "$code"
          fi
      - run: uv run yamllint -c .yamllint.yaml .
      # Pin the same version .pre-commit-config.yaml names. The action
      # defaults to `latest`, which drifts from the hook.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2
        with:
          version: 1.7.11
      - run: uv run lint-imports
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      # The hook file sits outside `[tool.ty.src] include`, so name it.
      - run: uv run ty check src tests .claude/hooks/pr_guard.py
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  docvet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Alberto-Codes/docvet@257310e5edc8249629d388d879a5afde602f02ca  # v1

  test:
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}, adk ${{ matrix.adk-version || 'latest' }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-py${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - name: Override ADK version (if pinned)
        if: matrix.adk-version != ''
        run: uv pip install google-adk==${{ matrix.adk-version }}
      # The coverage floor comes from `[tool.coverage.report] fail_under`.
      - name: Verify runtime versions and test
        shell: bash
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          EXPECTED_ADK: ${{ matrix.adk-version }}
        run: |
          uv run --no-sync python - <<'PYTHON'
          import importlib.metadata
          import os
          import sys
          import tomllib
          from pathlib import Path
          import pytest

          locked = tomllib.loads(Path("uv.lock").read_text())
          expected = os.environ["EXPECTED_ADK"] or next(
              p["version"] for p in locked["package"] if p["name"] == "google-adk"
          )
          actual = importlib.metadata.version("google-adk")
          python = ".".join(map(str, sys.version_info[:2]))
          print(f"Runtime: Python {python}; google-adk {actual}; expected {expected}", flush=True)
          assert actual == expected, (actual, expected)
          assert python == os.environ["UV_PYTHON"], (python, os.environ["UV_PYTHON"])
          raise SystemExit(pytest.main([
              "--cov=src", "--cov-report=term-missing", "--cov-report=xml"
          ]))
          PYTHON
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.adk-version == ''
        with:
          fail_ci_if_error: false
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  ci-gate:
    # Manual routine measurements must not overwrite the required PR check.
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI gate' || 'CI gate' }}
    if: always()
    needs: [plan, lint, type-check, docvet, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items()
                    if job["result"] != "success"}
          print(f"Required job results: {results}")
          if failed:
              print(f"Required checks did not succeed: {failed}", file=sys.stderr)
              sys.exit(1)
          PYTHON
