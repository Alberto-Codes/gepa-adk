name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Retry once on exit 3 only (runtime or configuration error, which
      # covers the advisory-fetch crash). Findings exit 1, 2, or 4 and
      # fail immediately.
      - name: uv-secure
        run: |
          code=0
          uv run uv-secure || code=$?
          if [ "$code" -eq 3 ]; then
            echo "uv-secure crashed (exit 3), retrying once"
            uv run uv-secure
          else
            exit "$code"
          fi
      - run: uv run yamllint -c .yamllint.yaml .
      # Pin the same version .pre-commit-config.yaml names. The action
      # defaults to `latest`, which drifts from the hook.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2
        with:
          version: 1.7.11
      - run: uv run lint-imports
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      # The hook file sits outside `[tool.ty.src] include`, so name it.
      - run: uv run ty check src tests .claude/hooks/pr_guard.py
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  docvet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Alberto-Codes/docvet@257310e5edc8249629d388d879a5afde602f02ca  # v1

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        adk-version: ["1.20.0", ""]  # "" = use locked/latest
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}, adk ${{ matrix.adk-version || 'latest' }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-py${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - name: Override ADK version (if pinned)
        if: matrix.adk-version != ''
        run: uv pip install google-adk==${{ matrix.adk-version }}
      # The coverage floor comes from `[tool.coverage.report] fail_under`.
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.adk-version == ''
        with:
          fail_ci_if_error: false
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true
